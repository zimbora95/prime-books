<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computing &amp; Robotics 7 · Learning Platform</title>
<style>
:root{--ink:#e13330;--navy:#173279;--blue:#2b5be8;--body:#3a4166;--paper:#fffdf6;
--card:#f0f4fd;--ok:#1e7a46;--bad:#c0392b;--bg:#f4f5fa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--body)}
header{background:#101b3f;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;color:#fff}
header .badge{background:var(--ink);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
header .dashbtn{margin-left:auto;background:var(--blue);border:0;color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
header .teach{background:#31406e;border:1px solid #5566a8}
.wrap{display:flex;min-height:calc(100vh - 58px)}
nav{width:280px;background:#fff;border-right:1px solid #e3e6f0;padding:16px 10px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
nav .unit{margin-bottom:6px}
nav .uhead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--navy);font-size:13.5px}
nav .uhead:hover{background:var(--card)}
nav .uhead .pct{font-size:11px;color:#8a90b8}
nav .topics{display:none;padding:2px 0 6px 12px}
nav .unit.open .topics{display:block}
nav .trow{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
nav .trow:hover{background:var(--card)}
nav .trow.done::before{content:"\2713";color:var(--ok);font-weight:700}
nav .trow.undone::before{content:"\25CB";color:#c3c8e0}
main{flex:1;padding:26px 34px;max-width:900px}
.hero h2{color:var(--ink);font-size:26px;margin:4px 0 6px}
.eyebrow{color:var(--blue);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--paper);border:1px solid #e7e2d2;border-radius:12px;padding:18px 20px;margin:14px 0}
.card h3{margin:0 0 10px;color:var(--navy);font-size:15px}
ul.obj{margin:0;padding-left:4px;list-style:none}
ul.obj li{padding:4px 0 4px 26px;position:relative}
ul.obj li::before{content:"\2713";position:absolute;left:2px;color:var(--blue);font-weight:700}
.kw b{color:var(--navy)}
.kw div{padding:3px 0}
.quiz{background:#fff;border:1px solid #dfe3f2;border-radius:12px;padding:18px 20px;margin:14px 0}
.q{padding:10px 0;border-bottom:1px solid #eef0f8}
.q p{margin:0 0 8px;font-weight:600;color:#20264a}
.opt{display:block;margin:4px 0;padding:8px 12px;border:1px solid #d8ddf0;border-radius:8px;cursor:pointer;font-size:14px}
.opt:hover{background:var(--card)}
.opt.sel{border-color:var(--blue);background:var(--card)}
.opt.right{border-color:var(--ok);background:#e8f7ee}
.opt.wrong{border-color:var(--bad);background:#fdeceb}
.score{font-weight:700;color:var(--navy);margin-top:10px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;margin-top:12px}
.progressbar{height:8px;background:#e3e6f0;border-radius:4px;overflow:hidden;flex:1}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,#2b5be8,#7c5cff)}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.badge-earned{background:linear-gradient(135deg,#ffd76e,#f2a13c);color:#5c3d00;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.badge-locked{background:#eceef6;color:#9aa0c0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;border:1px dashed #c9cde6}
.teachbox{background:#fff8e6;border:1px solid #eadfae;border-radius:10px;padding:14px 16px;margin:12px 0;font-size:14px}
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.unitcard{background:#fff;border:1px solid #e0e4f3;border-radius:12px;padding:16px;cursor:pointer}
.unitcard:hover{border-color:var(--blue)}
.unitcard h4{margin:0 0 6px;color:var(--navy)}
.prow{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:#7a80a8}
@media(max-width:860px){nav{width:220px}main{padding:18px}}
@media(max-width:640px){.wrap{flex-direction:column}nav{width:100%;max-height:250px;position:static}}
</style></head><body>

</header>

<nav id="nav"></nav>
<main id="main"></main>

ability.", "answer": true}, {"type": "tf", "stem": "Fair use lets you copy whole works for schoolwork.", "answer": false}], "7": [{"type": "mc", "stem": "The repeating line at the bottom of every page is the", "options": ["header", "footer", "margin", "style"], "answer": "B"}, {"type": "mc", "stem": "Body text in a tidy document should usually be", "options": ["centred", "right-aligned", "left-aligned", "justified only"], "answer": "C"}, {"type": "mc", "stem": "How many font families should a good document use?", "options": ["one", "two", "three", "as many as possible"], "answer": "A"}, {"type": "mc", "stem": "In a table, the top row naming each column is the", "options": ["cell", "header row", "footer", "key"], "answer": "B"}, {"type": "mc", "stem": "Page numbers should be", "options": ["typed by hand", "automatic fields", "in the header only", "omitted"], "answer": "B"}, {"type": "tf", "stem": "Colour alone should never carry meaning.", "answer": true}, {"type": "tf", "stem": "One idea per paragraph is a good rule.", "answer": true}, {"type": "tf", "stem": "Squashed columns with repeated units are fine.", "answer": false}, {"type": "tf", "stem": "A template helps keep documents consistent.", "answer": true}, {"type": "tf", "stem": "Headers should contain the main body text.", "answer": false}], "8": [{"type": "mc", "stem": "One fact per column is the definition of a", "options": ["record", "field", "key", "query"], "answer": "B"}, {"type": "mc", "stem": "A field that is unique for every record is the", "options": ["primary key", "name", "date", "type"], "answer": "A"}, {"type": "mc", "stem": "Removing a record permanently is", "options": ["add", "edit", "delete", "update"], "answer": "C"}, {"type": "mc", "stem": "To show change over time, use a", "options": ["pie chart", "bar chart", "line chart", "table"], "answer": "C"}, {"type": "mc", "stem": "A connection between two tables through a shared field is a", "options": ["link", "relationship", "join type", "filter"], "answer": "B"}, {"type": "tf", "stem": "A database should be designed before it is filled.", "answer": true}, {"type": "tf", "stem": "Borrowed (yes or no) suits a true/false data type.", "answer": true}, {"type": "tf", "stem": "A bulk update should never be previewed first.", "answer": false}, {"type": "tf", "stem": "Charts need titles but not axis labels.", "answer": false}, {"type": "tf", "stem": "The audience decides what to include in a report.", "answer": true}]}};
const LS = "pb-y07cs-progress";
let state = JSON.parse(localStorage.getItem(LS)||'{"topics":{},"quizzes":{}}');
const save = ()=>localStorage.setItem(LS, JSON.stringify(state));
let teacher = false;

function topicKey(t){return t.unit+"."+t.no}
function unitDone(u){
  const ts=DATA.topics.filter(t=>t.unit===u);
  if(!ts.length)return 0;
  return Math.round(100*ts.filter(t=>state.topics[topicKey(t)]).length/ts.length);
}
function badgeCount(){return Object.keys(state.topics).length}

function renderNav(){
  const nav=document.getElementById('nav');
  let h='';
  for(const [un,ut] of DATA.units){
    const topics=DATA.topics.filter(t=>t.unit===un);
    const p=unitDone(un);
    h+=`<div class="unit" data-u="${un}"><div class="uhead" onclick="this.parentNode.classList.toggle('open')">
      <span>${un}. ${ut}</span><span class="pct">${p}%</span></div><div class="topics">`;
    for(const t of topics){
      const k=topicKey(t);
      h+=`<div class="trow ${state.topics[k]?'done':'undone'}" onclick="showTopic('${un}','${t.no}')">${t.no} ${t.title}</div>`;
    }
    if(DATA.quizzes[un]&&DATA.quizzes[un].length){
      h+=`<div class="trow" onclick="showQuiz('${un}')">\u2753 Unit ${un} quiz</div>`;
    }
    h+='</div></div>';
  }
  nav.innerHTML=h;
}

function showDashboard(){
  const main=document.getElementById('main');
  let cards='';
  for(const [un,ut] of DATA.units){
    const p=unitDone(un);
    const q=state.quizzes[un];
    cards+=`<div class="unitcard" onclick="showQuiz('${un}')"><h4>Unit ${un} · ${ut}</h4>
      <div class="prow"><div class="progressbar"><i style="width:${p}%"></i></div><span>${p}% topics</span></div>
      ${q!=undefined?`<div class="prow"><span>Quiz best: <b>${q.score}/${q.total}</b></span></div>`:''}
    </div>`;
  }
  const badges=[];
  for(const [un,ut] of DATA.units){
    badges.push(unitDone(un)===100
      ? `<span class="badge-earned">\uD83C\uDFC6 ${ut} complete</span>`
      : `<span class="badge-locked">${ut} · ${unitDone(un)}%</span>`);
  }
  main.innerHTML=`<div class="hero"><div class="eyebrow">My dashboard</div>
    <h2>Progress and badges</h2>
    <p>${badgeCount()} of ${DATA.topics.length} topics completed · ${Object.keys(state.quizzes).length} quizzes attempted</p>
    <div class="badges">${badges.join('')}</div></div>
    <div class="unitgrid">${cards}</div>`;
  document.querySelectorAll('nav .trow').forEach(e=>e.style.background='');
}

function showTopic(un,no){
  const t=DATA.topics.find(x=>x.unit===un&&x.no===no);
  if(!t)return;
  const k=topicKey(t);
  const main=document.getElementById('main');
  main.innerHTML=`<div class="hero"><div class="eyebrow">Unit ${t.unit} · Topic ${t.no}</div><h2>${t.title}</h2></div>
   <div class="card"><h3>Learning objectives</h3><ul class="obj">${t.objectives.map(o=>'<li>'+o+'</li>').join('')}</ul></div>
   <div class="card kw"><h3>Key words</h3>${t.keywords.map(p=>'<div><b>'+p[0]+'</b> &mdash; '+p[1]+'</div>').join('')}</div>
   <div class="card"><h3>Done?</h3><button class="primary" onclick="markDone('${un}','${no}')">${state.topics[k]?'\u2713 Completed &mdash; click to undo':'Mark this topic complete'}</button>
   ${DATA.quizzes[un]&&DATA.quizzes[un].length?`<button class="primary" style="background:#31406e" onclick="showQuiz('${un}')">Take the Unit ${un} quiz</button>`:''}</div>`;
  if(teacher){
    main.insertAdjacentHTML('beforeend',`<div class="teachbox"><b>Teacher:</b> read the full lesson (explanation, examples, Try It, Robotics Connection, Challenge, Exit Ticket) in the Student Manual PDF, Units ${un}. Quiz answers are in the answer key below each quiz in teacher mode.</div>`);
  }
}
function markDone(un,no){
  const t=DATA.topics.find(x=>x.unit===un&&x.no===no);
  const k=topicKey(t);
  if(state.topics[k]) delete state.topics[k]; else state.topics[k]=Date.now();
  save(); renderNav(); showTopic(un,no);
}

function showQuiz(un){
  const qs=DATA.quizzes[un]||[];
  const ut=DATA.units.find(u=>u[0]===un)[1];
  const main=document.getElementById('main');
  if(!qs.length){main.innerHTML='<p>No quiz for this unit.</p>';return}
  let h=`<div class="hero"><div class="eyebrow">Assessment</div><h2>Unit ${un} quiz · ${ut}</h2>
   <p>${qs.length} questions · your answers are marked automatically</p></div><div class="quiz">`;
  qs.forEach((q,i)=>{
    h+=`<div class="q" data-i="${i}"><p>${i+1}. ${q.type==='tf'?(q.stem+' (True or false)'):q.stem}</p>`;
    if(q.type==='mc'){
      q.options.forEach((o,j)=>{
        h+=`<label class="opt" onclick="pick(${i},this)" data-v="${'ABCD'[j]}">${'ABCD'[j]}) ${o}</label>`;
      });
    }else{
      h+=`<label class="opt" onclick="pick(${i},this)" data-v="True">True</label>
          <label class="opt" onclick="pick(${i},this)" data-v="False">False</label>`;
    }
    h+='</div>';
  });
  h+=`</div><button class="primary" onclick="markQuiz('${un}')">Mark my quiz</button>`;
  if(teacher){
    h+=`<div class="teachbox"><b>Teacher answer key:</b><br>${qs.map((q,i)=>`${i+1}. ${q.type==='mc'?q.answer:q.answer}`).join(' &middot; ')}</div>`;
  }
  main.innerHTML=h;
  window._answers={};
}
function pick(i,el){
  document.querySelectorAll(`.q[data-i="${i}"] .opt`).forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  window._answers[i]=el.dataset.v;
}
function markQuiz(un){
  const qs=DATA.quizzes[un];
  let score=0;
  qs.forEach((q,i)=>{
    const given=window._answers[i];
    const correct=q.type==='mc'?q.answer:(q.answer?'True':'False');
    document.querySelectorAll(`.q[data-i="${i}"] .opt`).forEach(o=>{
      if(o.dataset.v===correct)o.classList.add('right');
      else if(o.dataset.v===given)o.classList.add('wrong');
    });
    if(given===correct)score++;
  });
  const prev=state.quizzes[un];
  if(!prev||score>prev.score)state.quizzes[un]={score,total:qs.length,at:(prev?prev.at+1:1)};
  else state.quizzes[un].at=prev.at+1;
  save();
  document.querySelector('.quiz').insertAdjacentHTML('beforeend',
    `<div class="score">Score: ${score}/${qs.length} &mdash; ${score===qs.length?'Perfect! \uD83C\uDF89':score>=qs.length*0.7?'Well done!':'Keep practising \u2014 reread the unit topics.'}</div>`);
}

document.getElementById('dashBtn').onclick=()=>{showDashboard()};
document.getElementById('teachBtn').onclick=()=>{teacher=!teacher;
  document.getElementById('teachBtn').textContent=teacher?'Teacher area ON':'Teacher area';
  showDashboard();};
renderNav();
showDashboard();
</script></body></html>
