<header><h1>Imprint page · seven designs</h1>
<p class="sub">One fresh page 2 for each Year 1 book, so one can be chosen as the standard for Years 1 to 5. Each book already carries its own version, so you can also open the books themselves and turn to page 2.</p></header><div class="grid">
<figure><img src="01-y01-global-perspectives.png" alt="Design 1 · Editorial colophon"><figcaption><b>Design 1 · Editorial colophon</b>Top rule with tracked imprint and the school mark, title block, two-column About text, cream One promise panel, three-column legal footer.<br>Shown on y01-global-perspectives.</figcaption></figure>
<figure><img src="02-y01-physical-education.png" alt="Design 2 · Card on sepia"><figcaption><b>Design 2 · Card on sepia</b>White card floating on a warm sepia page, amber hairline border, About in the left column and Safety in the right, legal block below the card.<br>Shown on y01-physical-education.</figcaption></figure>
<figure><img src="03-y01-german-a1a2.png" alt="Design 3 · Amber ribbon"><figcaption><b>Design 3 · Amber ribbon</b>Full-height amber spine ribbon with vertical imprint lettering, display title over a rule, cream feature panel with bulleted list, legal footer.<br>Shown on y01-german-a1a2.</figcaption></figure>
<figure><img src="04-y01-german-b1b2.png" alt="Design 4 · Centred masthead"><figcaption><b>Design 4 · Centred masthead</b>Classic centred colophon: school mark, double rule, centred title over a narrow measure, flanked section head, centred imprint foot.<br>Shown on y01-german-b1b2.</figcaption></figure>
<figure><img src="05-y01-spanish-a1a2.png" alt="Design 5 · Index card"><figcaption><b>Design 5 · Index card</b>Bordered index card with an amber IMPRINT tab and dotted leader lines linking each label to its value, feature list below.<br>Shown on y01-spanish-a1a2.</figcaption></figure>
<figure><img src="06-y01-spanish-b1b2.png" alt="Design 6 · Numbered editorial"><figcaption><b>Design 6 · Numbered editorial</b>Three numbered editorial sections above a full-width navy foot band with the imprint in white and the site in amber.<br>Shown on y01-spanish-b1b2.</figcaption></figure>
<figure><img src="07-y01-portuguese.png" alt="Design 7 · Keyline frame"><figcaption><b>Design 7 · Keyline frame</b>Fine amber keyline frame with corner ticks, centred masthead, dot-grid ornament, tidy centred colophon and badge.<br>Shown on y01-portuguese.</figcaption></figure>
